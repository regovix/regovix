# ── Regovix — Netlify Configuration ─────────────────────────────

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  [functions."ingest-document"]
    timeout = 60
  [functions."twin-query"]
    timeout = 15

[build.environment]
  NODE_VERSION = "18"

# ── HTTPS redirects ───────────────────────────────────────────────
[[redirects]]
  from  = "http://regovix.com.au/*"
  to    = "https://regovix.com.au/:splat"
  status = 301
  force  = true

[[redirects]]
  from  = "http://www.regovix.com.au/*"
  to    = "https://regovix.com.au/:splat"
  status = 301
  force  = true

[[redirects]]
  from  = "https://www.regovix.com.au/*"
  to    = "https://regovix.com.au/:splat"
  status = 301
  force  = true

# ── Named page routes ─────────────────────────────────────────────
[[redirects]]
  from   = "/pricing"
  to     = "/pricing.html"
  status = 200

[[redirects]]
  from   = "/privacy"
  to     = "/privacy.html"
  status = 200

[[redirects]]
  from   = "/terms"
  to     = "/terms.html"
  status = 200

[[redirects]]
  from   = "/callassist"
  to     = "/callassist.html"
  status = 200
  
[[redirects]]
  from   = "/twincore"
  to     = "/twincore.html"
  status = 200

# ── TwinCore API routes ───────────────────────────────────────────
[[redirects]]
  from = "/api/twin-query"
  to = "/.netlify/functions/twin-query"
  status = 200

[[redirects]]
  from = "/api/ingest-document"
  to = "/.netlify/functions/ingest-document"
  status = 200

[[redirects]]
  from = "/api/delete-document"
  to = "/.netlify/functions/delete-document"
  status = 200
[[redirects]]
  from = "/api/phone-call"
  to = "/.netlify/functions/phone-call"
  status = 200

[[redirects]]
  from = "/api/phone-transcribe"
  to = "/.netlify/functions/phone-transcribe"
  status = 200

# ── Security headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type  = "video/mp4"
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

# NOTE: No catch-all /* redirect — this allows /.netlify/functions/* to work